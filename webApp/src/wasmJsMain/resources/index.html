<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yole - Web Text Editor</title>
    <meta name="description" content="A versatile text editor supporting 18+ markup formats">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    
    <!-- PWA Theme Color -->
    <meta name="theme-color" content="#D32F2F">
    
    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Yole">
    
    <style>
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #ffffff;
            color: #333333;
            overflow: hidden;
        }
        
        /* iter-85: was #root (legacy ID) — corrected to #yoleCanvas to match
           the Kotlin ComposeViewport(viewportContainerId = "yoleCanvas") in
           Main.kt. Symptom of the old (broken) selector: the canvas div had
           no CSS height, fell back to height:auto, and Compose rendered into
           a content-sized strip (~154px tall on a 800px viewport) — leaving
           the bottom 80% of the page blank white. The render-gate.js byte-
           count heuristic missed it because PNG compresses huge white areas
           to near-nothing, hiding the regression. */
        #yoleCanvas {
            width: 100vw;
            height: 100vh;
        }
        
        /* Loading screen */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1E1E1E, #2D2D30);
            color: white;
            transition: opacity 0.4s ease;
        }
        
        .loading-logo {
            font-family: 'JetBrains Mono', 'Consolas', monospace;
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #D32F2F, #E53935);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .loading-subtitle {
            font-size: 13px;
            font-weight: 400;
            color: #858585;
            margin-bottom: 32px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(211, 47, 47, 0.15);
            border-top: 3px solid #D32F2F;
            border-radius: 50%;
            animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 14px;
            font-weight: 400;
            color: #B0B0B0;
        }
        
        .loading .fade-out {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- Loading screen -->
    <div id="loading" class="loading">
        <div class="loading-logo">Yole</div>
        <div class="loading-subtitle">IDE Text Editor</div>
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading workspace...</div>
    </div>
    
    <!-- Main app container — id MUST match `viewportContainerId` passed to
         ComposeViewport(...) in webApp/src/wasmJsMain/.../Main.kt.
         iter-84: was "root" — caused blank screen because Compose couldn't
         find its mount point and silently no-op'd. Now "yoleCanvas" to
         match the Kotlin code. Verified by webapp_render_validation_challenge. -->
    <div id="yoleCanvas"></div>

    <!-- Wasm bundle: webpack produces yole-web.js which loads the .wasm.
         iter-84: was MISSING — Kotlin/Wasm webpack does NOT auto-inject
         a script tag when index.html lives in src/wasmJsMain/resources/.
         Without this tag the bundle never executes and the page stays
         on the splash screen forever (then "blank" once splash fades).
         Verified by webapp_render_validation_challenge. -->
    <script src="yole-web.js" defer></script>

    <script>
        // Hide loading screen ONLY after the app actually mounts.
        // iter-84: was time-based (1200 ms unconditional). That meant the
        // splash faded even when Compose failed to mount, leaving the user
        // staring at a blank white page. Now we poll for Compose's canvas
        // injection AND fall back to a 10s timeout (in which case the
        // splash stays visible — better than a lie).
        (function () {
            const SPLASH_FADE_DELAY_MS = 400;
            const POLL_INTERVAL_MS = 100;
            // 25s — must exceed worst-case canvas-mount latency observed by the
            // iter-84 render gate (Compose mounts in ~11s under headless Chromium
            // SwiftShader; real user devices on slow networks may be slower).
            // Lower values cause the splash to leave + the user to see a blank
            // page even though Compose eventually mounts behind it.
            const FALLBACK_TIMEOUT_MS = 25000;
            const start = Date.now();
            function hideSplash() {
                const loading = document.getElementById('loading');
                if (!loading) return;
                loading.classList.add('fade-out');
                setTimeout(() => { loading.style.display = 'none'; }, SPLASH_FADE_DELAY_MS);
            }
            // CMP 1.11.0+ uses a Shadow DOM for its layer structure. The shadow host is
            // a DIV nested INSIDE #yoleCanvas (not #yoleCanvas itself). We must recursively
            // walk the element tree crossing shadow roots to find the canvas.
            function findCanvasDeep(el) {
                if (!el) return false;
                if (el.tagName === 'CANVAS') return true;
                if (el.shadowRoot) {
                    for (var i = 0; i < el.shadowRoot.children.length; i++) {
                        if (findCanvasDeep(el.shadowRoot.children[i])) return true;
                    }
                }
                for (var j = 0; j < el.children.length; j++) {
                    if (findCanvasDeep(el.children[j])) return true;
                }
                return false;
            }
            function poll() {
                // Compose Multiplatform (CMP 1.11.0+) injects a <canvas> inside the viewport
                // container. The canvas is in a Shadow DOM subtree inside #yoleCanvas.
                const container = document.getElementById('yoleCanvas');
                const composeMounted = container && findCanvasDeep(container);
                if (composeMounted) {
                    hideSplash();
                    return;
                }
                if (Date.now() - start > FALLBACK_TIMEOUT_MS) {
                    // Don't hide the splash — the app failed to mount.
                    // Leaving the splash visible is more honest per CONST-039
                    // than showing a blank white page.
                    console.error('[Yole] Compose did not mount within ' + FALLBACK_TIMEOUT_MS + 'ms — leaving splash visible');
                    return;
                }
                setTimeout(poll, POLL_INTERVAL_MS);
            }
            window.addEventListener('load', () => setTimeout(poll, POLL_INTERVAL_MS));
        })();

        // Service Worker registration for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/service-worker.js').then(function(registration) {
                    console.log('ServiceWorker registration successful');
                }, function(err) {
                    console.log('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
