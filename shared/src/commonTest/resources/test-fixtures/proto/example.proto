// iter-58 F2 Phase 6 fixture: Protocol Buffers.

syntax = "proto3";

package yole.fixtures;

option java_package = "digital.vasic.yole.fixtures";
option java_multiple_files = true;

message Greeter {
  string name = 1;
}

message GreetRequest {
  Greeter greeter = 1;
}

message GreetResponse {
  string message = 1;
}

service GreeterService {
  rpc Greet(GreetRequest) returns (GreetResponse);
}
