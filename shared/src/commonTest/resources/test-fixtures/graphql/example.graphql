# iter-58 F2 Phase 6 fixture: GraphQL.

type Greeter {
  id: ID!
  name: String!
  greeting: String!
}

type Query {
  greeter(name: String!): Greeter
  greeters: [Greeter!]!
}

type Mutation {
  createGreeter(name: String!): Greeter!
}

schema {
  query: Query
  mutation: Mutation
}
