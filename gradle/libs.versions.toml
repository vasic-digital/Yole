# Kotlinx bundle for common use
kotlinx = [
    "kotlinx-coroutines-core",
    "kotlinx-serialization-json",
    "kotlinx-datetime",
    "kotlinx-io-core",
]

# Compose bundle for UI
compose = [
    "compose-runtime",
    "compose-foundation",
    "compose-material3",
    "compose-ui",
    "compose-ui-util",
]

# AndroidX bundle
androidx = [
    "androidx-core-ktx",
    "androidx-appcompat",
    "androidx-lifecycle-runtime",
    "androidx-lifecycle-viewmodel",
]

# Flexmark bundle for Markdown
flexmark = [
    "flexmark-core",
    "flexmark-util",
    "flexmark-ext-emoji",
    "flexmark-ext-gfm-tasklist",
    "flexmark-ext-superscript",
    "flexmark-ext-autolink",
    "flexmark-ext-toc",
    "flexmark-ext-tables",
    "flexmark-ext-jekyll",
    "flexmark-ext-anchorlink",
    "flexmark-ext-strikethrough",
    "flexmark-ext-footnotes",
    "flexmark-ext-gitlab",
    "flexmark-ext-typographic",
    "flexmark-ext-admonition",
    "flexmark-ext-ins",
    "flexmark-ext-wikilink",
    "flexmark-ext-yaml",
]

# Testing bundle
testing = [
    "kotlin-test",
    "kotest-framework-engine",
    "kotest-assertions-core",
    "kotest-property",
    "mockk",
    "turbine",
]

# Android Testing bundle
android-testing = [
    "androidx-test-junit",
    "androidx-test-espresso-core",
    "mockk-android",
]

[plugins]
# Kotlin Plugins
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinx-benchmark" }

# Compose
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

# Android
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }

# Documentation and Code Quality
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }

# Build Tools
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions" }

# Google Services (Firebase)
google-services = { id = "com.google.gms.google-services", version = "4.4.2" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version = "3.0.3" }
