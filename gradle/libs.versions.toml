# Yole - Kotlin Multiplatform Version Catalog
# Centralized dependency management for all platforms

[versions]
# Kotlin and Core
kotlin = "2.0.20"
agp = "8.9.0"
compose = "1.7.3"
compose-plugin = "1.7.3"

# Kotlinx Libraries
kotlinx-coroutines = "1.9.0"
kotlinx-serialization = "1.7.3"
kotlinx-datetime = "0.6.1"
kotlinx-io = "0.6.0"
kotlinx-atomicfu = "0.26.1"
kotlinx-benchmark = "0.4.11"

# AndroidX Libraries
androidx-core = "1.15.0"
androidx-appcompat = "1.7.0"
androidx-activity = "1.9.3"
androidx-lifecycle = "2.8.7"
androidx-navigation = "2.8.4"
androidx-datastore = "1.1.1"
androidx-documentfile = "1.0.1"
androidx-browser = "1.8.0"
androidx-preference = "1.2.1"
androidx-test-junit = "1.2.1"
androidx-test-espresso = "3.5.0"
androidx-multidex = "2.0.1"

# Material Design
material = "1.12.0"
material3 = "1.3.1"

# Format-Specific Libraries
flexmark = "0.64.8"
opencsv = "5.9"
commonmark = "0.23.0"

# File System
okio = "3.9.1"

# Utilities
apache-commons-lang3 = "3.17.0"
commons-io = "2.18.0"
gson = "2.11.0"

# Ktor (for potential network operations)
ktor = "3.0.2"

# Protocol Libraries
sshj = "0.38.0"
smbj = "0.13.0"

# jsoup (iter-64 Phase 4) — HTML parser for HtmlImporter.
# BSD-2-Clause license. JVM-only (desktopMain + androidMain).
# Version 1.17.2 verified on Maven Central 2026-05-16.
jsoup = "1.17.2"

# flexmark-html2md-converter (iter-64 Phase 4) — HTML→Markdown conversion.
# BSD-2-Clause license. Uses the same flexmark 0.64.8 version already on the
# classpath; zero additional transitive cost beyond the module JAR (~200 KB).
# Artifact: com.vladsch.flexmark:flexmark-html2md-converter:0.64.8.

# Apache POI (iter-64 Phase 3) — OOXML lite variant for .docx import.
# poi-ooxml-lite ships only the XWPF/XSSF APIs; excludes the heavy XML
# processing chain that poi-ooxml pulls in. ~6 MB vs ~15 MB on the classpath.
# Verified on Maven Central 2026-05-16; centic9/poi-on-android keep-rule set
# applied in androidApp/proguard-rules.pro. stax:stax-api excluded (Android
# ships its own StAX implementation). multiDex enabled for Android (method
# count exceeds 64k with POI on the classpath).
poi = "5.5.1"

# LSP4J (iter-61 Phase 4) — Eclipse LSP4J JSON-RPC client/server.
# Pinned at 1.0.0 (released 2026-02-10) per Phase 0 research §8.
# JDK 11 compatible. MIT / EPL-2.0 dual-licensed.
lsp4j = "1.0.0"

# Tree-Sitter (iter-57 Phase 5)
# bonede tree-sitter-ng: JDK 11+ bytecode, MIT licensed, JAR bundles native
# .so/.dylib/.dll for x86_64-linux, aarch64-linux, x86_64-macos, aarch64-macos,
# x86_64-windows (verified by inspecting the JAR contents). NO Android NDK .so
# is published upstream today — Android initialize() returns Result.failure.
# Picked over io.github.tree-sitter:jtreesitter (requires JDK 23, incompatible
# with Yole desktop jvmTarget=11) and com.itsaky.androidide.treesitter
# (project archived 2024-10-18, no tree-sitter-markdown grammar published).
# iter-58 F2 Phase 7: bumped core 0.22.6 -> 0.26.6 so the Phase-7-added
# grammars built against tree-sitter ABI 15 (python, javascript, go,
# rust, c, css, bash, php, julia and others) parse without segfaulting.
# Verified compatible with the iter-57 markdown integration via re-run
# of Feature2LanguageSmokeTest. The Yole-replacement NativeUtils on
# Android remains source-compatible (loadLib(String) signature unchanged).
tree-sitter = "0.26.6"
tree-sitter-markdown = "0.7.1a"

# iter-58 F2 Phase 7 — bonede Tree-Sitter language grammar artifacts.
# Each JAR ships native binaries for 5 Desktop targets:
#   aarch64-linux-gnu, aarch64-macos, x86_64-linux-gnu, x86_64-macos, x86_64-windows
# Versions snapshot taken 2026-05-15 from Maven Central <latest> metadata.
# Verified resolvable via tools/build-language-grammars.sh extract.
# The 7 Yole langs NOT bundled here (jsx, xml, vim, less, crystal, groovy,
# bibtex) have no published bonede artifact — documented in
# docs/KNOWN_DEFECTS.md#f2-phase-7-no-bonede-artifact.
ts-kotlin = "0.3.8.1"
ts-java = "0.23.5"
ts-python = "0.25.0"
ts-javascript = "0.25.0"
ts-typescript = "0.23.2"
ts-go = "0.25.0"
ts-rust = "0.24.0"
ts-c = "0.24.1"
ts-cpp = "0.23.4"
ts-html = "0.23.2"
ts-css = "0.25.0"
ts-sql = "gh-pages-a"
ts-json = "0.24.8"
ts-tsx = "0.23.2"
ts-yaml = "0.5.0a"
ts-toml = "0.5.1a"
ts-bash = "0.25.1"
ts-ruby = "0.23.1"
ts-php = "0.24.2"
ts-swift = "0.5.0"
ts-scala = "0.24.0"
ts-dart = "master-a"
ts-lua = "2.1.3a"
ts-perl = "1.1.0"
ts-haskell = "0.23.1"
ts-ocaml = "0.23.2"
ts-julia = "0.25.0"
ts-r = "main-a"
ts-elixir = "0.2.0"
ts-erlang = "0.1.0a"
ts-fortran = "master-a"
ts-dockerfile = "0.2.0"
ts-make = "main-a"
ts-hcl = "1.1.0a"
ts-regex = "1.0.0"
ts-vue = "0.2.1a"
ts-graphql = "master-a"
ts-csharp = "0.23.1"
ts-scss = "1.0.0a"
ts-nix = "master-a"
ts-zig = "main-a"
ts-elm = "5.7.0a"
ts-clojure = "0.0.12a"
# ts-nim 0.6.0 segfaults on parse with bonede core 0.26.6 (and 0.24.4 +
# 0.25.3 also crash) — see KNOWN_DEFECTS#f2-phase-7-nim-grammar-broken.
# Held out of the dependency list until either bonede republishes a
# compatible JAR or Yole builds from source.
ts-objc = "main-a"
ts-latex = "0.3.0a"
ts-proto = "main-a"

# Testing
junit = "4.13.2"
junit5 = "5.11.3"
kotest = "5.9.1"
assertj = "3.26.3"
mockk = "1.13.13"
turbine = "1.2.0"
kover = "0.8.3"
robolectric = "4.14.1"

# Firebase
firebase-bom = "33.13.0"

# UI Libraries (Android)
gene-rate = "1.1.8"
app-intro = "6.3.1"
epub-parser = "1.0.95"
color-picker = "3.1.0"

# Build Tools
dokka = "2.0.0"
gradle-versions = "0.51.0"

