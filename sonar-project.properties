# SonarQube Project Configuration for Yole
# Local: ./gradlew sonar -Dsonar.token=YOUR_TOKEN
# CI: token provided via SONAR_TOKEN secret

# Default host URL for local SonarQube (override with -Dsonar.host.url=...)
sonar.host.url=http://localhost:9000

# Project identification
sonar.projectKey=yole
sonar.projectName=Yole
sonar.projectVersion=2.19.0
sonar.organization=vasic-digital

# Source configuration
sonar.sources=shared/src/commonMain/kotlin,\
              shared/src/androidMain/kotlin,\
              shared/src/desktopMain/kotlin,\
              shared/src/iosMain/kotlin,\
              shared/src/wasmJsMain/kotlin,\
              androidApp/src/main/java,\
              androidApp/src/main/kotlin,\
              desktopApp/src/main/kotlin,\
              webApp/src/wasmJsMain/kotlin,\
              iosApp/src/iosMain/kotlin,\
              commons/src/main/kotlin,\
              core/thirdparty/java

sonar.tests=shared/src/commonTest/kotlin,\
            shared/src/androidTest/kotlin,\
            shared/src/desktopTest/kotlin,\
            androidApp/src/test,\
            androidApp/src/androidTest,\
            desktopApp/src/test,\
            webApp/src/wasmJsTest/kotlin

# Encoding
sonar.sourceEncoding=UTF-8

# Language configuration
sonar.kotlin.file.suffixes=.kt,.kts
sonar.java.file.suffixes=.java

# Exclusions
sonar.exclusions=**/build/**,\
                 **/generated/**,\
                 **/*.min.js,\
                 **/test/**,\
                 **/androidTest/**

sonar.test.exclusions=**/test/**,**/androidTest/**

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=build/reports/kover/report.xml,\
                                      shared/build/reports/kover/report.xml

# Detekt reports
sonar.kotlin.detekt.reportPaths=build/reports/detekt/detekt.xml

# Android Lint reports
sonar.androidLint.reportPaths=androidApp/build/reports/lint-results-debug.xml

# Quality gate
sonar.qualitygate.wait=true

# Duplicate detection
sonar.cpd.kotlin.minimumTokens=50
sonar.cpd.java.minimumTokens=50

# Issue assignment
sonar.issue.ignore.multicriteria=e1

# Ignore generated code issues
sonar.issue.ignore.multicriteria.e1.ruleKey=*
sonar.issue.ignore.multicriteria.e1.resourceKey=**/generated/**
