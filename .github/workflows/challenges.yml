# CI workflow for the Challenges and Containers Go submodules
# Builds, tests, and validates all challenge banks on push/PR to master

name: Challenges

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: challenges-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  challenges:
    name: Build & Test Challenge Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: |
            Challenges/go.sum
            Containers/go.sum

      - name: Build Containers submodule
        working-directory: Containers
        run: |
          go build ./...
          go vet ./...

      - name: Test Containers submodule
        working-directory: Containers
        run: go test ./... -race -count=1

      - name: Build Challenges submodule
        working-directory: Challenges
        run: |
          go build ./...
          go vet ./...

      - name: Test Challenges submodule
        working-directory: Challenges
        run: go test ./... -race -count=1

      - name: Validate challenge bank JSON syntax
        run: |
          echo "Validating JSON syntax of all challenge banks..."
          errors=0
          for f in Challenges/banks/yole/*.json; do
            if ! python3 -m json.tool "$f" > /dev/null 2>&1; then
              echo "ERROR: Invalid JSON in $f"
              errors=$((errors + 1))
            else
              count=$(python3 -c "import json; print(len(json.load(open('$f')).get('challenges', [])))")
              echo "OK: $(basename "$f") ($count challenges)"
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "FAILED: $errors bank files have invalid JSON"
            exit 1
          fi
          echo "All challenge bank files are valid JSON"

      - name: Validate challenge bank structure
        run: |
          echo "Validating challenge bank structure..."
          python3 - <<'PYEOF'
          import json
          import os
          import sys

          bank_dir = "Challenges/banks/yole"
          errors = []
          all_ids = set()
          total_challenges = 0

          for filename in sorted(os.listdir(bank_dir)):
              if not filename.endswith(".json"):
                  continue
              filepath = os.path.join(bank_dir, filename)
              with open(filepath) as f:
                  bank = json.load(f)

              for field in ["version", "name", "metadata", "challenges"]:
                  if field not in bank:
                      errors.append(f"{filename}: missing top-level field '{field}'")

              metadata = bank.get("metadata", {})
              for field in ["project", "domain", "description"]:
                  if field not in metadata:
                      errors.append(f"{filename}: missing metadata field '{field}'")

              for ch in bank.get("challenges", []):
                  total_challenges += 1
                  ch_id = ch.get("id", "<missing>")

                  for field in ["id", "name", "description", "category", "assertions"]:
                      if field not in ch:
                          errors.append(f"{filename}: challenge '{ch_id}' missing field '{field}'")

                  if ch_id in all_ids:
                      errors.append(f"{filename}: duplicate challenge ID '{ch_id}'")
                  all_ids.add(ch_id)

                  if not ch_id.startswith("yole-"):
                      errors.append(f"{filename}: challenge ID '{ch_id}' must start with 'yole-'")

                  for assertion in ch.get("assertions", []):
                      if "type" not in assertion:
                          errors.append(f"{filename}: assertion in '{ch_id}' missing 'type'")
                      if "target" not in assertion:
                          errors.append(f"{filename}: assertion in '{ch_id}' missing 'target'")
                      if "message" not in assertion:
                          errors.append(f"{filename}: assertion in '{ch_id}' missing 'message'")

          print(f"Validated {total_challenges} challenges across {len([f for f in os.listdir(bank_dir) if f.endswith('.json')])} files")

          if errors:
              print(f"\nFAILED: {len(errors)} validation errors:")
              for e in errors:
                  print(f"  - {e}")
              sys.exit(1)
          else:
              print("All challenge banks pass structural validation")
          PYEOF

      - name: Summarize challenge bank counts
        if: always()
        run: |
          total=0
          echo "## Challenge Bank Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bank | Challenges |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|:----------:|" >> "$GITHUB_STEP_SUMMARY"
          for f in Challenges/banks/yole/*.json; do
            count=$(python3 -c "import json; print(len(json.load(open('$f')).get('challenges', [])))")
            total=$((total + count))
            echo "| $(basename "$f") | $count |" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "| **Total** | **$total** |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Challenges test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: challenges-test-results
          path: |
            Challenges/reports/
            Challenges/results/
          retention-days: 14
          if-no-files-found: ignore
