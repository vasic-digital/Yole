name: "Yole CodeQL Configuration"
queries:
  - uses: security-and-quality
paths:
  - shared/src/commonMain
  - shared/src/androidMain
  - shared/src/desktopMain
  - androidApp/src
  - desktopApp/src
paths-ignore:
  - '**/test/**'
  - '**/build/**'
  - 'doc/**'
  - 'Challenges/**'
  - 'Containers/**'
