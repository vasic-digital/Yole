# Robolectric Configuration
# Enables full Android testing without emulator

# SDK versions for Robolectric
robolectric:
  sdk: 35
  minSdk: 24
  targetSdk: 35

# Enable/shadow Android classes
shadows:
  - org.robolectric.shadows.ShadowMediaPlayer
  - org.robolectric.shadows.ShadowAlarmManager
  - org.robolectric.shadows.ShadowLocationManager

# Resources handling
resources:
  mode: shadows
  validateTranslucency: true

# JVM args for tests
jvmArgs:
  - -Xmx4096m
  - -XX:+UseG1GC

# Enable parallel test execution
parallel:
  enabled: true
  maxParallel: 4

# Include/exclude patterns
include:
  - '**/*Test.class'
  - '**/*Tests.class'

exclude:
  - '**/android/**'
  - '**/espresso/**'

# Report options
report:
  html: true
  xml: true

# False positive detection
strictMode:
  killAfterSlowTests: false
  failOnHardAssertions: false

# Cache
cache:
  dir: ~/.gradle/caches/robolectric
  maxSize: 512MB
