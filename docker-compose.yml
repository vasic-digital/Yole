# Yole Build Environment
version: '3.8'

services:
  # Build container using pre-built Android SDK image
  build:
    image: docker.io/thyrlian/android-sdk:latest
    container_name: yole-build
    volumes:
      # Mount parent dir at /workspace so settings.gradle.kts's
      # includeBuild("../RateLimiter-KMP") etc. resolve to the actual
      # sibling KMP repos. Yole itself lives at /workspace/Yole.
      - ..:/workspace
      - ./releases:/workspace/Yole/releases
      - ${HOME}/.gradle:/root/.gradle
      - ${HOME}/.m2:/root/.m2
      - ${HOME}/Android/Sdk:/opt/android-sdk
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
    working_dir: /workspace/Yole
    command: sleep infinity
    # Sized to fit Gradle JVM (-Xmx4096m) + Kotlin daemon (-Xmx4096m) +
    # JVM metaspace + JIT + IO buffers concurrently. The previous 4g limit
    # produced exit-137 OOM kills during shared:desktopTest because the
    # two JVMs together exceeded the limit. See §12 / §12.6 in
    # CONSTITUTION.md — total project usage on host stays well under 60%
    # of typical 32 GiB workstation RAM. Operators with smaller hosts
    # should override via docker-compose.override.yml.
    mem_limit: 8g
    memswap_limit: 12g
    cpus: 2

  # Alternative using thyrlian/android-sdk
  build-alt:
    image: docker.io/thyrlian/android-sdk:latest
    container_name: yole-build-alt
    volumes:
      - .:/workspace
      - ./releases:/workspace/releases
    working_dir: /workspace
    command: sleep infinity

  # Dedicated Robolectric test container — isolated from the main build so
  # Robolectric's classloader / shadow-Android quirks don't interfere with
  # the assembly path. Per the user mandate: "all existing tests and
  # Challenges MUST work in anti-bluff manner — they MUST confirm that all
  # tested codebase really works as expected." The Robolectric tests
  # exercise the Compose UI on a simulated Android JVM; they have a tighter
  # memory profile (no Compose desktop or Wasm tasks) so we give them a
  # smaller cap. Same parent-dir mount strategy as `build` so siblings
  # resolve via composite-build.
  robolectric-test:
    image: docker.io/thyrlian/android-sdk:latest
    container_name: yole-robolectric-test
    volumes:
      - ..:/workspace
      - ${HOME}/.gradle:/root/.gradle
      - ${HOME}/.m2:/root/.m2
      - ${HOME}/Android/Sdk:/opt/android-sdk
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
    working_dir: /workspace/Yole
    command:
      - bash
      - -c
      - "./gradlew :androidApp:testDebugUnitTest --tests '*.robolectric.*' -PincludeRobolectric=true --no-daemon"
    mem_limit: 6g
    memswap_limit: 9g
    cpus: 2

  # SonarQube Community Edition for code quality analysis
  sonarqube:
    image: docker.io/library/sonarqube:community
    container_name: yole-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    profiles:
      - security
      - full
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    mem_limit: 2g
    memswap_limit: 3g
    restart: unless-stopped

  # Snyk CLI for vulnerability scanning
  snyk:
    image: docker.io/snyk/snyk:gradle-jdk17
    container_name: yole-snyk
    volumes:
      - .:/project
    working_dir: /project
    environment:
      - SNYK_TOKEN=${SNYK_TOKEN:-}
    profiles:
      - security
      - full
    mem_limit: 1g
    restart: "no"

  # Detekt static analysis runner
  detekt:
    image: docker.io/library/eclipse-temurin:17-jdk
    container_name: yole-detekt
    volumes:
      - .:/workspace
      - ${HOME}/.gradle:/root/.gradle
    working_dir: /workspace
    command: ./gradlew detekt
    profiles:
      - security
      - full
    mem_limit: 2g
    restart: "no"

volumes:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
