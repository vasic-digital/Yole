# Yole Build Environment
version: '3.8'

services:
  # Build container using pre-built Android SDK image
  build:
    image: cirrusci/android-sdk:latest
    container_name: yole-build
    privileged: true
    volumes:
      - .:/workspace
      - ./releases:/workspace/releases
    working_dir: /workspace
    command: sleep infinity

  # Alternative using thyrlian/android-sdk
  build-alt:
    image: thyrlian/android-sdk:latest
    container_name: yole-build-alt
    privileged: true
    volumes:
      - .:/workspace
      - ./releases:/workspace/releases
    working_dir: /workspace
    command: sleep infinity
